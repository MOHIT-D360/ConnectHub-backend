server:
  port: ${GATEWAY_PORT:8080}

spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:api-gateway/.env[.properties]"
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - ${FRONTEND_URL:http://localhost:4200}
              - https://connect-hub-frontend-one.vercel.app
              - https://connect-hub-frontend.vercel.app
              - https://connect-hub-frontend-*.vercel.app
              - https://connect-hub-frontend-git-*-mohit-d360s-projects.vercel.app
              - https://connect-hub-frontend-git-main-mohit-d360s-projects.vercel.app
              - http://localhost:4200
              - http://localhost:*
              - http://127.0.0.1:4200
              - http://127.0.0.1:*
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - '*'
            exposedHeaders:
              - Authorization
              - Content-Type
              - X-RateLimit-Limit
              - X-RateLimit-Remaining
              - X-RateLimit-Reset
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        # Auth Routes
        - id: oauth2-route
          uri: ${AUTH_SERVICE_URI:lb://AUTH-SERVICE}
          predicates: [Path=/oauth2/**]
        - id: oauth2-callback-route
          uri: ${AUTH_SERVICE_URI:lb://AUTH-SERVICE}
          predicates: [Path=/login/oauth2/**]
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:lb://AUTH-SERVICE}
          predicates: [Path=/api/v1/auth/**]
        - id: websocket-service-api
          uri: ${WEBSOCKET_SERVICE_URI:lb://websocket-service}
          predicates: [Path=/api/v1/ws/**]
        - id: websocket-service-ws
          uri: ${WEBSOCKET_SERVICE_WS_URI:lb:ws://websocket-service}
          predicates: ["Path=/ws/*/*/websocket,/ws/websocket"]
        - id: websocket-service-sockjs
          uri: ${WEBSOCKET_SERVICE_URI:lb://websocket-service}
          predicates: [Path=/ws/**]

        # API Documentation Routes (Swagger)
        - id: auth-service-docs
          uri: ${AUTH_SERVICE_URI:lb://AUTH-SERVICE}
          predicates: [Path=/auth-docs/**]
          filters:
            - "RewritePath=/auth-docs/(?<remaining>.*), /${remaining}"
        - id: room-service-docs
          uri: ${ROOM_SERVICE_URI:lb://room-service}
          predicates: [Path=/room-docs/**]
          filters:
            - "RewritePath=/room-docs/(?<remaining>.*), /${remaining}"
        - id: message-service-docs
          uri: ${MESSAGE_SERVICE_URI:lb://message-service}
          predicates: [Path=/message-docs/**]
          filters:
            - "RewritePath=/message-docs/(?<remaining>.*), /${remaining}"
        - id: media-service-docs
          uri: ${MEDIA_SERVICE_URI:lb://media-service}
          predicates: [Path=/media-docs/**]
          filters:
            - "RewritePath=/media-docs/(?<remaining>.*), /${remaining}"
        - id: presence-service-docs
          uri: ${PRESENCE_SERVICE_URI:lb://presence-service}
          predicates: [Path=/presence-docs/**]
          filters:
            - "RewritePath=/presence-docs/(?<remaining>.*), /${remaining}"
        - id: notification-service-docs
          uri: ${NOTIFICATION_SERVICE_URI:lb://notification-service}
          predicates: [Path=/notification-docs/**]
          filters:
            - "RewritePath=/notification-docs/(?<remaining>.*), /${remaining}"
        - id: websocket-service-docs
          uri: ${WEBSOCKET_SERVICE_URI:lb://websocket-service}
          predicates: [Path=/websocket-docs/**]
          filters:
            - "RewritePath=/websocket-docs/(?<remaining>.*), /${remaining}"
        - id: payment-service-docs
          uri: ${PAYMENT_SERVICE_URI:lb://PAYMENT-SERVICE}
          predicates: [Path=/payment-docs/**]
          filters:
            - "RewritePath=/payment-docs/(?<remaining>.*), /${remaining}"

        # Business Service Routes
        - id: media-public-read
          uri: ${MEDIA_SERVICE_URI:lb://media-service}
          predicates: [Path=/api/v1/public/media/**]
          filters:
            - "RewritePath=/api/v1/public/media/(?<remaining>.*), /api/v1/media/${remaining}"
        - id: room-service
          uri: ${ROOM_SERVICE_URI:lb://room-service}
          predicates: [Path=/api/v1/rooms/**]
        - id: message-service
          uri: ${MESSAGE_SERVICE_URI:lb://message-service}
          predicates: [Path=/api/v1/messages/**]
        - id: media-service
          uri: ${MEDIA_SERVICE_URI:lb://media-service}
          predicates: [Path=/api/v1/media/**]
        - id: presence-service
          uri: ${PRESENCE_SERVICE_URI:lb://presence-service}
          predicates: [Path=/api/v1/presence/**]
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:lb://notification-service}
          predicates: [Path=/api/v1/notifications/**]
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:lb://PAYMENT-SERVICE}
          predicates: [Path=/api/v1/payments/**]

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  boot:
    admin:
      client:
        url: http://${ADMIN_SERVER_HOST:localhost}:${ADMIN_SERVER_PORT:8089}
        username: ${ADMIN_USER:admin}
        password: ${ADMIN_PASSWORD:admin_password}

jwt:
  secret: ${JWT_SECRET:fUfwkEaeomu7puBOIl0ftR50UPF4CBPUDxZ0lcaGXL2hY3Zai4DS4YO7l4902IJsKVdHyNjdpCL4LX7IGkw2qg==}

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
    instance-id: ${EUREKA_INSTANCE_INSTANCE_ID:${spring.application.name}:${server.port}}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,loggers
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: auth-service
        url: /auth-docs/v3/api-docs
      - name: room-service
        url: /room-docs/v3/api-docs
      - name: message-service
        url: /message-docs/v3/api-docs
      - name: media-service
        url: /media-docs/v3/api-docs
      - name: presence-service
        url: /presence-docs/v3/api-docs
      - name: notification-service
        url: /notification-docs/v3/api-docs
      - name: websocket-service
        url: /websocket-docs/v3/api-docs
      - name: payment-service
        url: /payment-docs/v3/api-docs
