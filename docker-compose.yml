networks:
  connecthub-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  sonarqube_data:

services:

  mysql:
    image: mysql:8.0
    container_name: connecthub-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: connecthub
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - connecthub-network

  redis:
    image: redis:7-alpine
    container_name: connecthub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - connecthub-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: connecthub-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - connecthub-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: connecthub-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - connecthub-network

  sonarqube:
    image: sonarqube:lts-community
    container_name: connecthub-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
    networks:
      - connecthub-network

  service-registry:
    build:
      context: .
      dockerfile: service-registry/Dockerfile
    container_name: connecthub-service-registry
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      EUREKA_HOST: service-registry
      EUREKA_PORT: 8761
      ADMIN_SERVER_HOST: admin-server
    networks:
      - connecthub-network

  admin-server:
    build:
      context: .
      dockerfile: admin-server/Dockerfile
    container_name: connecthub-admin-server
    restart: unless-stopped
    depends_on:
      - service-registry
    ports:
      - "8089:8089"
    environment:
      EUREKA_HOST: service-registry
      EUREKA_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: admin-server
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_INSTANCE_ID: admin-server:8089
    networks:
      - connecthub-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: connecthub-api-gateway
    restart: unless-stopped
    depends_on:
      - service-registry
      - redis
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_HOST: service-registry
      EUREKA_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_INSTANCE_ID: api-gateway:8080
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_SERVER_HOST: admin-server
      AUTH_SERVICE_URI: http://auth-service:8081
      ROOM_SERVICE_URI: http://room-service:8082
      MESSAGE_SERVICE_URI: http://message-service:8083
      NOTIFICATION_SERVICE_URI: http://notification-service:8084
      PAYMENT_SERVICE_URI: http://payment-service:8085
      PRESENCE_SERVICE_URI: http://presence-service:8086
      WEBSOCKET_SERVICE_URI: http://websocket-service:8087
      WEBSOCKET_SERVICE_WS_URI: ws://websocket-service:8087
      MEDIA_SERVICE_URI: http://media-service:8088
    networks:
      - connecthub-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: connecthub-auth-service
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - kafka
      - service-registry
    ports:
      - "8081:8081"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_HOST: service-registry
      EUREKA_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: auth-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_INSTANCE_ID: auth-service:8081
      AUTH_SERVICE_HOST: auth-service
      ADMIN_SERVER_HOST: admin-server
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GATEWAY_URL: ${GATEWAY_URL:-https://api.connect-hub.dev}
      FRONTEND_URL: ${FRONTEND_URL:-https://connect-hub-frontend-one.vercel.app}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
    networks:
      - connecthub-network

  room-service:
    build:
      context: .
      dockerfile: room-service/Dockerfile
    container_name: connecthub-room-service
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - kafka
      - service-registry
    ports:
      - "8082:8082"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_HOST: service-registry
      EUREKA_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: room-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_INSTANCE_ID: room-service:8082
      ADMIN_SERVER_HOST: admin-server
    networks:
      - connecthub-network

  message-service:
    build:
      context: .
      dockerfile: message-service/Dockerfile
    container_name: connecthub-message-service
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - kafka
      - service-registry
    ports:
      - "8083:8083"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_HOST: service-registry
      EUREKA_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: message-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_INSTANCE_ID: message-service:8083
      ADMIN_SERVER_HOST: admin-server
    networks:
      - connecthub-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: connecthub-notification-service
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - kafka
      - service-registry
    ports:
      - "8084:8084"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_HOST: service-registry
      EUREKA_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: notification-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_INSTANCE_ID: notification-service:8084
      ADMIN_SERVER_HOST: admin-server

      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}

    networks:
      - connecthub-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: connecthub-payment-service
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - kafka
      - service-registry
    ports:
      - "8085:8085"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_HOST: service-registry
      EUREKA_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: payment-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_INSTANCE_ID: payment-service:8085
      ADMIN_SERVER_HOST: admin-server

      JWT_SECRET: ${JWT_SECRET}

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PRO_PLAN_ID: ${RAZORPAY_PRO_PLAN_ID:-}

    networks:
      - connecthub-network

  presence-service:
    build:
      context: .
      dockerfile: presence-service/Dockerfile
    container_name: connecthub-presence-service
    restart: unless-stopped
    depends_on:
      - redis
      - service-registry
    ports:
      - "8086:8086"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

      EUREKA_HOST: service-registry
      EUREKA_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: presence-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_INSTANCE_ID: presence-service:8086
      ADMIN_SERVER_HOST: admin-server

    networks:
      - connecthub-network

  websocket-service:
    build:
      context: .
      dockerfile: websocket-service/Dockerfile
    container_name: connecthub-websocket-service
    restart: unless-stopped
    depends_on:
      - redis
      - kafka
      - service-registry
    ports:
      - "8087:8087"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_HOST: service-registry
      EUREKA_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: websocket-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_INSTANCE_ID: websocket-service:8087
      ADMIN_SERVER_HOST: admin-server

      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}

    networks:
      - connecthub-network

  media-service:
    build:
      context: .
      dockerfile: media-service/Dockerfile
    container_name: connecthub-media-service
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - kafka
      - service-registry
    ports:
      - "8088:8088"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_HOST: service-registry
      EUREKA_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: media-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_INSTANCE_ID: media-service:8088
      ADMIN_SERVER_HOST: admin-server

      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}

    networks:
      - connecthub-network
